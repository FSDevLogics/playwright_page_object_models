name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    # Instala o uv
    - name: Set up uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true
        
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        
    # Instala as dependências lendo o pyproject.toml e o uv.lock
    - name: Install dependencies
      run: uv sync

    # O uv cria um ambiente virtual, então rodamos os comandos com 'uv run'
    - name: Ensure browsers are installed
      run: uv run playwright install --with-deps
      
    - name: Run your tests
      run: uv run pytest --tracing=retain-on-failure
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-traces
        path: test-results/